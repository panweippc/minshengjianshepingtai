# 民生建设项目管理平台 后端配置
server:
  port: 8081

spring:
  application:
    name: msjs-backend
  # 文件上传限制（常量类同步约束）
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.2.14:3306/msjs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: dev_user
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.msjs.project.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO 对象存储（本项目独立实例，避免与其他项目冲突使用 9100 端口）
minio:
  endpoint: http://localhost:9100
  access-key: minioadmin
  secret-key: minioadmin

# 本地文件存储（开发环境临时方案，后续可切换至 MinIO）
file:
  upload-dir: ./uploads

# Knife4j 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.msjs.project: debug
