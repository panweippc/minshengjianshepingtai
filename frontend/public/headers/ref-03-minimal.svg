<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格C：极简细线商务（几乎纯线框） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 70" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06172b"/>
      <stop offset="100%" stop-color="#041220"/>
    </linearGradient>
    <filter id="fC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="70" fill="url(#bgC)"/>

  <!-- 顶部一条细亮线 -->
  <line x1="0" y1="0.5" x2="1920" y2="0.5" stroke="rgba(80,200,255,0.6)" stroke-width="1" filter="url(#fC)"/>
  <line x1="0" y1="2.5" x2="1920" y2="2.5" stroke="rgba(80,200,255,0.2)" stroke-width="0.6"/>
  <!-- 底部一条细暗线 -->
  <line x1="0" y1="69.5" x2="1920" y2="69.5" stroke="rgba(80,200,255,0.3)" stroke-width="0.8"/>

  <!-- 标题区：极细回形框 对向排列 -->
  <g stroke="rgba(100,220,255,0.7)" stroke-width="1" fill="none" filter="url(#fC)">
    <!-- 左：三个回形放大 -->
    <rect x="722" y="20" width="10" height="10"/>
    <rect x="714" y="16" width="26" height="18"/>
    <rect x="706" y="12" width="42" height="26"/>
    <rect x="698" y="8"  width="58" height="34"/>
    <!-- 右：镜像 -->
    <rect x="1188" y="20" width="10" height="10"/>
    <rect x="1180" y="16" width="26" height="18"/>
    <rect x="1172" y="12" width="42" height="26"/>
    <rect x="1164" y="8"  width="58" height="34"/>
  </g>

  <!-- 标题下方中心对称的短线组 -->
  <g stroke="rgba(100,220,255,0.5)" stroke-width="0.7">
    <line x1="660" y1="48" x2="740" y2="48"/>
    <line x1="750" y1="54" x2="820" y2="54" stroke-width="0.5"/>
    <line x1="1080" y1="54" x2="1150" y2="54" stroke-width="0.5"/>
    <line x1="1180" y1="48" x2="1260" y2="48"/>
  </g>

  <!-- 左侧细竖线组（像刻度） -->
  <g stroke="rgba(100,220,255,0.3)" stroke-width="0.6">
    <line x1="160" y1="14" x2="160" y2="56"/>
    <line x1="180" y1="20" x2="180" y2="50" stroke-width="0.4"/>
    <line x1="200" y1="26" x2="200" y2="44" stroke-width="0.3"/>
  </g>
  <!-- 右侧镜像 -->
  <g stroke="rgba(100,220,255,0.3)" stroke-width="0.6">
    <line x1="1760" y1="14" x2="1760" y2="56"/>
    <line x1="1740" y1="20" x2="1740" y2="50" stroke-width="0.4"/>
    <line x1="1720" y1="26" x2="1720" y2="44" stroke-width="0.3"/>
  </g>

  <!-- 极小点状装饰序列 -->
  <g fill="rgba(100,220,255,0.4)">
    <circle cx="280" cy="35" r="1.4"/>
    <circle cx="305" cy="35" r="1.1"/>
    <circle cx="328" cy="35" r="0.9"/>
    <circle cx="1612" cy="35" r="0.9"/>
    <circle cx="1635" cy="35" r="1.1"/>
    <circle cx="1660" cy="35" r="1.4"/>
  </g>
</svg>
