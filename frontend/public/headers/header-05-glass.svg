<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格05：玻璃拟态风（磨砂蓝+白色反光条） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 140" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051a33"/>
      <stop offset="50%" stop-color="#0a3262"/>
      <stop offset="100%" stop-color="#06182c"/>
    </linearGradient>
    <linearGradient id="glass5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,240,255,0.22)"/>
      <stop offset="40%" stop-color="rgba(60,160,240,0.12)"/>
      <stop offset="100%" stop-color="rgba(20,60,120,0.22)"/>
    </linearGradient>
    <linearGradient id="edge5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(200,250,255,0.95)"/>
      <stop offset="50%" stop-color="rgba(80,200,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(20,60,120,0)"/>
    </linearGradient>
    <filter id="g5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="140" fill="url(#bg5)"/>

  <!-- 整块玻璃底板 -->
  <polygon points="0,10 1920,10 1880,70 1920,130 0,130 40,70" fill="url(#glass5)"/>
  <!-- 玻璃顶部反光高光 -->
  <polygon points="0,10 1920,10 1900,20 20,20" fill="rgba(220,250,255,0.18)"/>
  <!-- 玻璃底部深色底边 -->
  <polygon points="0,130 1920,130 1900,122 20,122" fill="rgba(0,20,50,0.3)"/>

  <!-- 玻璃边缘描边 -->
  <polygon points="0,10 1920,10 1880,70 1920,130 0,130 40,70" fill="none" stroke="rgba(140,220,255,0.45)" stroke-width="0.8"/>

  <!-- 标题左右水晶棱 -->
  <g filter="url(#g5)">
    <!-- 左：多面水晶 -->
    <polygon points="710,34 740,54 720,74 690,54" fill="rgba(200,250,255,0.25)" stroke="rgba(220,250,255,0.9)" stroke-width="1"/>
    <polygon points="710,34 740,54 720,74 690,54" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.3"/>
    <!-- 右：镜像水晶 -->
    <polygon points="1210,34 1180,54 1200,74 1230,54" fill="rgba(200,250,255,0.25)" stroke="rgba(220,250,255,0.9)" stroke-width="1"/>
    <polygon points="1210,34 1180,54 1200,74 1230,54" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.3"/>
  </g>

  <!-- 中心光束 -->
  <line x1="680" y1="110" x2="1240" y2="110" stroke="rgba(180,240,255,0.8)" stroke-width="1.5" filter="url(#g5)"/>
  <line x1="720" y1="116" x2="1200" y2="116" stroke="rgba(180,240,255,0.4)" stroke-width="0.8"/>

  <!-- 四角细 bracket -->
  <g stroke="rgba(220,250,255,0.7)" stroke-width="1" fill="none">
    <polyline points="8,8 8,22 22,22"/>
    <polyline points="1912,8 1912,22 1898,22"/>
    <polyline points="8,132 8,118 22,118"/>
    <polyline points="1912,132 1912,118 1898,118"/>
  </g>
</svg>
