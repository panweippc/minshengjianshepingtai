<?xml version="1.0" encoding="UTF-8"?>
<!-- G4 · 全息效果：半透明环 + 分段发光 + 体积感 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="g4-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#071a2a"/>
      <stop offset="100%" stop-color="#010410"/>
    </radialGradient>
    <filter id="g4-holo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g4-holo2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g4-seg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5af0ff"/>
      <stop offset="50%" stop-color="#b678ff"/>
      <stop offset="100%" stop-color="#5af0ff"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="150" fill="url(#g4-bg)"/>

  <!-- 外环：多个分段弧（全息发光） -->
  <g filter="url(#g4-holo)" stroke-linecap="round" fill="none">
    <path d="M 80 38 A 130 130 0 0 1 130 22" stroke="#6ff0ff" stroke-width="3" opacity="0.85"/>
    <path d="M 170 22 A 130 130 0 0 1 220 38" stroke="#b678ff" stroke-width="3" opacity="0.85"/>
    <path d="M 262 80 A 130 130 0 0 1 278 130" stroke="#6ff0ff" stroke-width="3" opacity="0.85"/>
    <path d="M 278 170 A 130 130 0 0 1 262 220" stroke="#b678ff" stroke-width="3" opacity="0.85"/>
    <path d="M 220 262 A 130 130 0 0 1 170 278" stroke="#6ff0ff" stroke-width="3" opacity="0.85"/>
    <path d="M 130 278 A 130 130 0 0 1 80 262" stroke="#b678ff" stroke-width="3" opacity="0.85"/>
    <path d="M 38 220 A 130 130 0 0 1 22 170" stroke="#6ff0ff" stroke-width="3" opacity="0.85"/>
    <path d="M 22 130 A 130 130 0 0 1 38 80" stroke="#b678ff" stroke-width="3" opacity="0.85"/>
  </g>
  <!-- 再画一层实一点的弧 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 80 38 A 130 130 0 0 1 130 22" stroke="#6ff0ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 170 22 A 130 130 0 0 1 220 38" stroke="#b678ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 262 80 A 130 130 0 0 1 278 130" stroke="#6ff0ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 278 170 A 130 130 0 0 1 262 220" stroke="#b678ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 220 262 A 130 130 0 0 1 170 278" stroke="#6ff0ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 130 278 A 130 130 0 0 1 80 262" stroke="#b678ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 38 220 A 130 130 0 0 1 22 170" stroke="#6ff0ff" stroke-width="1.6" opacity="0.95"/>
    <path d="M 22 130 A 130 130 0 0 1 38 80" stroke="#b678ff" stroke-width="1.6" opacity="0.95"/>
  </g>

  <!-- 内环：较粗的半透明全息环 -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(140,230,255,0.25)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="150" cy="150" r="110" fill="none" stroke="rgba(180,130,255,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- 小网格点（全息感） -->
  <g fill="rgba(120,220,255,0.5)" filter="url(#g4-holo2)">
    <circle cx="70" cy="70" r="1.2"/>
    <circle cx="230" cy="70" r="1.2"/>
    <circle cx="70" cy="230" r="1.2"/>
    <circle cx="230" cy="230" r="1.2"/>
    <circle cx="150" cy="30" r="1.6"/>
    <circle cx="150" cy="270" r="1.6"/>
  </g>

  <!-- 底部 3D 切面弧 -->
  <path d="M 28 150 A 122 122 0 0 0 272 150" stroke="rgba(0,0,0,0.45)" stroke-width="3" fill="none"/>
</svg>
