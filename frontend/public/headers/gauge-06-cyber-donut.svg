<?xml version="1.0" encoding="UTF-8"?>
<!-- G6 · 赛博切割：厚 torus 环 + 切面高光 + 外环缺口 + 发光刻度 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="g6-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1426"/>
      <stop offset="100%" stop-color="#02050c"/>
    </radialGradient>
    <linearGradient id="g6-torus-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb7ee"/>
      <stop offset="40%" stop-color="#1a385a"/>
      <stop offset="100%" stop-color="#0a1828"/>
    </linearGradient>
    <linearGradient id="g6-torus-bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="60%" stop-color="#224e82"/>
      <stop offset="100%" stop-color="#7cb7ee"/>
    </linearGradient>
    <filter id="g6-neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="150" fill="url(#g6-bg)"/>

  <!-- 主 torus 环（厚，上下分色 = 3D 切面） -->
  <!-- 上半环 -->
  <path d="M 150 18 A 132 132 0 0 1 150 282 A 124 124 0 0 0 150 18 Z" fill="url(#g6-torus-top)"/>
  <!-- 下半环 -->
  <path d="M 150 282 A 132 132 0 0 1 150 18 A 124 124 0 0 0 150 282 Z" fill="url(#g6-torus-bot)"/>

  <!-- 顶部高光弧 -->
  <path d="M 65 44 A 128 128 0 0 1 235 44" stroke="rgba(220,245,255,0.5)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#g6-neon)"/>

  <!-- 外环 6 个赛博缺口 -->
  <g fill="#02050c" stroke="rgba(60,120,180,0.4)" stroke-width="0.6">
    <rect x="146" y="12" width="12" height="10" transform="rotate(0 150 150)"/>
    <rect x="146" y="12" width="12" height="10" transform="rotate(60 150 150)"/>
    <rect x="146" y="12" width="12" height="10" transform="rotate(120 150 150)"/>
    <rect x="146" y="12" width="12" height="10" transform="rotate(180 150 150)"/>
    <rect x="146" y="12" width="12" height="10" transform="rotate(240 150 150)"/>
    <rect x="146" y="12" width="12" height="10" transform="rotate(300 150 150)"/>
  </g>

  <!-- 内环（较细金属环） -->
  <circle cx="150" cy="150" r="116" fill="none" stroke="rgba(80,160,240,0.55)" stroke-width="1.2"/>
  <circle cx="150" cy="150" r="112" fill="none" stroke="rgba(30,80,140,0.35)" stroke-width="0.8"/>

  <!-- 发光刻度（12 个 = 每 30°） -->
  <g stroke="#33f0d0" stroke-width="2.5" stroke-linecap="round" filter="url(#g6-neon)">
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(0 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(30 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(60 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(90 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(120 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(150 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(180 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(210 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(240 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(270 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(300 150 150)"/>
    <line x1="150" y1="20" x2="150" y2="12" transform="rotate(330 150 150)"/>
  </g>

  <!-- 底部切面弧 -->
  <path d="M 22 150 A 128 128 0 0 0 278 150" stroke="rgba(0,0,0,0.55)" stroke-width="5" fill="none"/>
</svg>
