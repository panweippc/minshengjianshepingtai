<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格B：双层玻璃条 + 极光色流 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 90" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080a1e"/>
      <stop offset="30%" stop-color="#0a1a4a"/>
      <stop offset="50%" stop-color="#0a2a5a"/>
      <stop offset="70%" stop-color="#0a1a4a"/>
      <stop offset="100%" stop-color="#080a1e"/>
    </linearGradient>
    <linearGradient id="aurB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(200,60,255,0)"/>
      <stop offset="30%" stop-color="rgba(0,220,255,0.9)"/>
      <stop offset="50%" stop-color="rgba(200,80,255,0.95)"/>
      <stop offset="70%" stop-color="rgba(0,220,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(200,60,255,0)"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,240,255,0.14)"/>
      <stop offset="50%" stop-color="rgba(30,90,180,0.08)"/>
      <stop offset="100%" stop-color="rgba(10,40,90,0.14)"/>
    </linearGradient>
    <filter id="fB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="90" fill="url(#bgB)"/>

  <!-- 双层玻璃条（主条 + 薄副条） -->
  <rect x="0" y="14" width="1920" height="56" fill="url(#glassB)" stroke="rgba(140,220,255,0.25)" stroke-width="0.6"/>
  <!-- 主条顶部反光 -->
  <rect x="0" y="14" width="1920" height="3" fill="rgba(220,250,255,0.18)"/>
  <!-- 主条底部暗边 -->
  <rect x="0" y="68" width="1920" height="2" fill="rgba(0,20,50,0.5)"/>

  <!-- 极光流动光弧（柔和层） -->
  <g filter="url(#fB)" opacity="0.85">
    <path d="M 0 20 Q 480 40 960 30 Q 1440 20 1920 40 L 1920 70 Q 1440 50 960 60 Q 480 70 0 50 Z" fill="url(#aurB)"/>
  </g>

  <!-- 标题区：半透明悬浮胶囊（更高级感） -->
  <g filter="url(#fB)">
    <rect x="760" y="18" width="400" height="54" rx="6" fill="rgba(6,20,50,0.6)" stroke="rgba(200,240,255,0.55)" stroke-width="0.8"/>
    <rect x="760" y="18" width="400" height="2.5" rx="1.2" fill="rgba(200,250,255,0.85)"/>
  </g>

  <!-- 标题左右流光箭头（紫/青双色） -->
  <g filter="url(#fB)">
    <polygon points="744,45 758,32 758,58" fill="rgba(0,220,255,0.9)"/>
    <polygon points="1176,45 1162,32 1162,58" fill="rgba(200,80,255,0.9)"/>
  </g>

  <!-- 主条上下发光边线 -->
  <line x1="0" y1="14" x2="1920" y2="14" stroke="rgba(0,220,255,0.6)" stroke-width="0.8" filter="url(#fB)"/>
  <line x1="0" y1="70" x2="1920" y2="70" stroke="rgba(0,220,255,0.6)" stroke-width="0.8" filter="url(#fB)"/>

  <!-- 四角 bracket -->
  <g stroke="rgba(200,230,255,0.7)" stroke-width="1" fill="none" filter="url(#fB)">
    <polyline points="10,10 10,24 24,24"/>
    <polyline points="1910,10 1910,24 1896,24"/>
    <polyline points="10,80 10,66 24,66"/>
    <polyline points="1910,80 1910,66 1896,66"/>
  </g>
</svg>
