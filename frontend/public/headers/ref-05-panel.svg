<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格E：左右斜切面板 + 中心水晶柱（参考图那种大块面板感） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 86" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061c38"/>
      <stop offset="50%" stop-color="#0a2e58"/>
      <stop offset="100%" stop-color="#061c38"/>
    </linearGradient>
    <linearGradient id="topE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,230,255,0)"/>
      <stop offset="25%" stop-color="rgba(0,230,255,0.75)"/>
      <stop offset="50%" stop-color="rgba(180,250,255,1)"/>
      <stop offset="75%" stop-color="rgba(0,230,255,0.75)"/>
      <stop offset="100%" stop-color="rgba(0,230,255,0)"/>
    </linearGradient>
    <filter id="fE" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="86" fill="url(#bgE)"/>

  <!-- 贯穿高光线 -->
  <line x1="0" y1="1" x2="1920" y2="1" stroke="url(#topE)" stroke-width="1.3" filter="url(#fE)"/>
  <!-- 底部暗光带 -->
  <rect x="0" y="76" width="1920" height="10" fill="url(#topE)" opacity="0.22"/>

  <!-- 左侧大块斜切面板 -->
  <polygon
    points="0,16 390,16 440,42 440,50 390,76 0,76"
    fill="rgba(10,50,100,0.35)"
    stroke="rgba(0,210,255,0.55)" stroke-width="0.9"/>
  <!-- 面板顶部高光边 -->
  <polygon points="0,16 390,16 440,42 0,42" fill="rgba(180,240,255,0.07)"/>

  <!-- 左侧面板内竖线分隔 -->
  <line x1="120" y1="20" x2="120" y2="72" stroke="rgba(0,210,255,0.3)" stroke-width="0.7"/>
  <line x1="240" y1="20" x2="240" y2="72" stroke="rgba(0,210,255,0.2)" stroke-width="0.5"/>
  <line x1="340" y1="20" x2="340" y2="72" stroke="rgba(0,210,255,0.2)" stroke-width="0.5"/>

  <!-- 右侧斜切面板镜像 -->
  <polygon
    points="1920,16 1530,16 1480,42 1480,50 1530,76 1920,76"
    fill="rgba(10,50,100,0.35)"
    stroke="rgba(0,210,255,0.55)" stroke-width="0.9"/>
  <polygon points="1920,16 1530,16 1480,42 1920,42" fill="rgba(180,240,255,0.07)"/>
  <line x1="1800" y1="20" x2="1800" y2="72" stroke="rgba(0,210,255,0.3)" stroke-width="0.7"/>
  <line x1="1680" y1="20" x2="1680" y2="72" stroke="rgba(0,210,255,0.2)" stroke-width="0.5"/>
  <line x1="1580" y1="20" x2="1580" y2="72" stroke="rgba(0,210,255,0.2)" stroke-width="0.5"/>

  <!-- 中心：水晶柱基座（标题底衬） -->
  <g filter="url(#fE)">
    <!-- 光环底衬 -->
    <ellipse cx="960" cy="44" rx="280" ry="24" fill="rgba(30,130,230,0.22)"/>
    <ellipse cx="960" cy="44" rx="180" ry="14" fill="rgba(60,200,255,0.3)"/>
  </g>
  <!-- 中心发光横线（标题下） -->
  <line x1="820" y1="58" x2="1100" y2="58" stroke="rgba(180,250,255,0.75)" stroke-width="1.2" filter="url(#fE)"/>
  <line x1="860" y1="64" x2="1060" y2="64" stroke="rgba(0,210,255,0.35)" stroke-width="0.6"/>

  <!-- 标题两侧装饰尖角 -->
  <g filter="url(#fE)">
    <polygon points="780,44 802,24 802,64" fill="rgba(0,230,255,0.85)"/>
    <polygon points="1140,44 1118,24 1118,64" fill="rgba(0,230,255,0.85)"/>
  </g>

  <!-- 四角 bracket -->
  <g stroke="rgba(0,230,255,0.65)" stroke-width="1.2" fill="none" filter="url(#fE)">
    <polyline points="10,10 10,24 24,24"/>
    <polyline points="1910,10 1910,24 1896,24"/>
    <polyline points="10,76 10,62 24,62"/>
    <polyline points="1910,76 1910,62 1896,62"/>
  </g>
</svg>
