<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格03：极简线条风（干净、几何、细线条） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 140" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030d1c"/>
      <stop offset="100%" stop-color="#051830"/>
    </linearGradient>
    <filter id="g3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="140" fill="url(#bg3)"/>

  <!-- 顶部渐变细线 -->
  <line x1="0" y1="0" x2="1920" y2="0" stroke="rgba(60,180,255,0.7)" stroke-width="1"/>
  <line x1="0" y1="3" x2="1920" y2="3" stroke="rgba(60,180,255,0.2)" stroke-width="0.6"/>

  <!-- 标题区：左右简洁几何框 -->
  <g stroke="rgba(90,200,255,0.85)" stroke-width="1.2" fill="none" filter="url(#g3)">
    <!-- 左：回形 -->
    <rect x="730" y="42" width="18" height="18"/>
    <rect x="724" y="36" width="30" height="30"/>
    <rect x="718" y="30" width="42" height="42"/>
    <!-- 右：回形镜像 -->
    <rect x="1172" y="42" width="18" height="18"/>
    <rect x="1166" y="36" width="30" height="30"/>
    <rect x="1160" y="30" width="42" height="42"/>
  </g>

  <!-- 标题下方对称短线 -->
  <g stroke="rgba(90,200,255,0.5)" stroke-width="0.8">
    <line x1="700" y1="100" x2="780" y2="100"/>
    <line x1="1140" y1="100" x2="1220" y2="100"/>
    <line x1="710" y1="106" x2="770" y2="106" stroke-width="0.5"/>
    <line x1="1150" y1="106" x2="1210" y2="106" stroke-width="0.5"/>
  </g>

  <!-- 左侧装饰：细竖线组 -->
  <g stroke="rgba(90,200,255,0.35)" stroke-width="0.8">
    <line x1="140" y1="30" x2="140" y2="110"/>
    <line x1="170" y1="40" x2="170" y2="100" stroke-width="0.6"/>
    <line x1="200" y1="50" x2="200" y2="90" stroke-width="0.5"/>
  </g>
  <!-- 右侧装饰：细竖线组 -->
  <g stroke="rgba(90,200,255,0.35)" stroke-width="0.8">
    <line x1="1780" y1="30" x2="1780" y2="110"/>
    <line x1="1810" y1="40" x2="1810" y2="100" stroke-width="0.6"/>
    <line x1="1840" y1="50" x2="1840" y2="90" stroke-width="0.5"/>
  </g>

  <!-- 极小点状装饰 -->
  <g fill="rgba(90,200,255,0.6)">
    <circle cx="260" cy="70" r="1.5"/>
    <circle cx="300" cy="70" r="1"/>
    <circle cx="340" cy="70" r="0.8"/>
    <circle cx="1580" cy="70" r="0.8"/>
    <circle cx="1620" cy="70" r="1"/>
    <circle cx="1660" cy="70" r="1.5"/>
  </g>
</svg>
