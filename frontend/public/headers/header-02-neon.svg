<?xml version="1.0" encoding="UTF-8"?>
<!-- 风格02：霓虹科技风（紫色/青色发光，炫酷感） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 140" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a38"/>
      <stop offset="30%" stop-color="#081838"/>
      <stop offset="70%" stop-color="#081a3a"/>
      <stop offset="100%" stop-color="#1a0a38"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(180,80,255,0)"/>
      <stop offset="30%" stop-color="rgba(0,230,255,0.9)"/>
      <stop offset="50%" stop-color="rgba(200,100,255,1)"/>
      <stop offset="70%" stop-color="rgba(0,230,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(180,80,255,0)"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(160,80,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="140" fill="url(#bg2)"/>

  <!-- 中心紫霓虹光晕 -->
  <ellipse cx="960" cy="70" rx="560" ry="55" fill="url(#halo2)"/>

  <!-- 霓虹光带条 -->
  <rect x="0" y="30" width="1920" height="2" fill="url(#glow2)" filter="url(#g2)" opacity="0.8"/>
  <rect x="0" y="108" width="1920" height="2" fill="url(#glow2)" filter="url(#g2)" opacity="0.8"/>

  <!-- 中心霓虹框（标题区） -->
  <g filter="url(#g2)">
    <polygon points="740,40 780,40 780,100 740,100 720,70" fill="none" stroke="rgba(0,230,255,0.9)" stroke-width="1.5"/>
    <polygon points="1180,40 1140,40 1140,100 1180,100 1200,70" fill="none" stroke="rgba(200,100,255,0.9)" stroke-width="1.5"/>
  </g>

  <!-- 左右侧发光三角装饰 -->
  <g filter="url(#g2)">
    <polygon points="80,70 110,40 140,70 110,100" fill="rgba(0,230,255,0.15)" stroke="rgba(0,230,255,0.8)" stroke-width="1.2"/>
    <polygon points="1780,70 1810,40 1840,70 1810,100" fill="rgba(200,100,255,0.15)" stroke="rgba(200,100,255,0.8)" stroke-width="1.2"/>
  </g>

  <!-- 霓虹粒子 -->
  <g filter="url(#g2)">
    <circle cx="220" cy="50" r="1.8" fill="#00e6ff"/>
    <circle cx="380" cy="90" r="1.3" fill="#c864ff"/>
    <circle cx="1540" cy="50" r="1.8" fill="#00e6ff"/>
    <circle cx="1700" cy="90" r="1.3" fill="#c864ff"/>
    <circle cx="480" cy="42" r="1" fill="#00e6ff"/>
    <circle cx="1440" cy="98" r="1" fill="#c864ff"/>
  </g>

  <!-- 四角 bracket -->
  <g stroke="rgba(0,230,255,0.9)" stroke-width="1.6" fill="none" filter="url(#g2)">
    <polyline points="12,12 12,32 34,32"/>
    <polyline points="1908,12 1908,32 1886,32"/>
    <polyline points="12,128 12,108 34,108"/>
    <polyline points="1908,128 1908,108 1886,108"/>
  </g>
  <!-- 紫角 bracket -->
  <g stroke="rgba(200,100,255,0.7)" stroke-width="1" fill="none">
    <polyline points="8,8 8,20 22,20"/>
    <polyline points="1912,8 1912,20 1898,20"/>
    <polyline points="8,132 8,120 22,120"/>
    <polyline points="1912,132 1912,120 1898,120"/>
  </g>
</svg>
