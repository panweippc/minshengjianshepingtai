<?xml version="1.0" encoding="UTF-8"?>
<!-- G1 · HUD 飞机仪表风格：金属外环 + 精细刻度 + 顶部高光 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="g1-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#061a2a"/>
      <stop offset="100%" stop-color="#020a14"/>
    </radialGradient>
    <conicGradient id="g1-bezel" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4bb0ff"/>
      <stop offset="40%"  stop-color="#2a6fa0"/>
      <stop offset="60%"  stop-color="#65c8ff"/>
      <stop offset="100%" stop-color="#3a90d0"/>
    </conicGradient>
    <filter id="g1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 最外底色圆 -->
  <circle cx="150" cy="150" r="150" fill="url(#g1-bg)"/>

  <!-- 金属外环（立体切角） -->
  <circle cx="150" cy="150" r="142" fill="#0a1c2c" stroke="url(#g1-bezel)" stroke-width="4"/>
  <!-- 高光（顶部偏光） -->
  <path d="M 150 10 A 140 140 0 0 1 260 55" stroke="rgba(180,240,255,0.35)" stroke-width="2" fill="none"/>
  <path d="M 150 10 A 140 140 0 0 0 40 55" stroke="rgba(180,240,255,0.22)" stroke-width="1.2" fill="none"/>

  <!-- 第二层细环 -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(90,180,255,0.35)" stroke-width="1"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="rgba(60,140,220,0.25)" stroke-width="0.6"/>

  <!-- HUD 刻度（60 个小刻度 + 12 个大刻度） -->
  <g stroke="#6cc8ff" stroke-linecap="round" opacity="0.85">
    <!-- 60 个刻度线：每 6° 一个 -->
    <g id="g1-ticks">
      <!-- 用 12 大 × 5 小 = 60 -->
    </g>
  </g>

  <!-- 用 <g transform> 批量画刻度 -->
  <g stroke="#6cc8ff" stroke-linecap="round">
    <g id="g1-all">
      <!-- 每 30° 一个大刻度 -->
      <g transform="rotate(0 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(30 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(60 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(90 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(120 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(150 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(180 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(210 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(240 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(270 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(300 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <g transform="rotate(330 150 150)">
        <line x1="150" y1="22" x2="150" y2="34" stroke-width="2" stroke="rgba(200,240,255,0.95)"/>
      </g>
      <!-- 每 6° 一个小刻度 -->
      <g transform="rotate(6 150 150)"><line x1="150" y1="24" x2="150" y2="30" stroke-width="0.8" stroke="rgba(120,200,255,0.6)"/></g>
      <g transform="rotate(12 150 150)"><line x1="150" y1="24" x2="150" y2="30" stroke-width="0.8" stroke="rgba(120,200,255,0.6)"/></g>
