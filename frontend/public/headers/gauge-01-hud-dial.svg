  <!-- 内高光圆环 -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(100,200,255,0.25)" stroke-width="0.6"/>

  <!-- 内圈深色弧段（3D 切面感） -->
  <path d="M 30 150 A 120 120 0 0 1 270 150" stroke="rgba(0,10,20,0.4)" stroke-width="3" fill="none"/>

  <!-- 中心亮环 -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="rgba(100,200,255,0.18)" stroke-width="0.8"/>
