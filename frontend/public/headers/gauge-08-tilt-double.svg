<?xml version="1.0" encoding="UTF-8"?>
<!-- gauge-08-tilt-double：双层 -20° 倾斜椭圆环（内外圈均保留） -->
<!-- 已移除所有圆/椭圆/刻度短竖线（用户要求） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#071a2a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020610" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3f70"/>
      <stop offset="30%" stop-color="#3ea8e0"/>
      <stop offset="50%" stop-color="#e2faff"/>
      <stop offset="70%" stop-color="#3ea8e0"/>
      <stop offset="100%" stop-color="#1a3f70"/>
    </linearGradient>
    <linearGradient id="i-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1c5c"/>
      <stop offset="35%" stop-color="#6f48d0"/>
      <stop offset="50%" stop-color="#dcc8ff"/>
      <stop offset="65%" stop-color="#6f48d0"/>
      <stop offset="100%" stop-color="#2a1c5c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 整组旋转 -20° -->
  <g transform="translate(500 500) rotate(-20)">

    <!-- 外圈椭圆（蓝青） -->
    <ellipse rx="460" ry="110" fill="none" stroke="url(#o-ring)" stroke-width="4.5" filter="url(#glow)"/>
    <ellipse rx="460" ry="110" fill="none" stroke="url(#o-ring)" stroke-width="1.8"/>
    <!-- 外圈下切面暗弧（3D） -->
    <ellipse rx="460" ry="110" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="5.5"/>

    <!-- 内圈椭圆（紫蓝） -->
    <ellipse rx="360" ry="86" fill="none" stroke="url(#i-ring)" stroke-width="3.5" filter="url(#glow)"/>
    <ellipse rx="360" ry="86" fill="none" stroke="url(#i-ring)" stroke-width="1.4"/>
    <!-- 内圈下切面暗弧（3D） -->
    <ellipse rx="360" ry="86" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="4.5"/>

  </g>
</svg>
